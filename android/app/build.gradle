plugins {
    id 'com.android.application'
}

def serverUrl = (project.findProperty('serverUrl') ?: 'https://tonrgminer2026x.onrender.com').toString()
def releaseKeystore = System.getenv('ANDROID_RELEASE_KEYSTORE')
def releasePassword = System.getenv('ANDROID_RELEASE_PASSWORD')
if (!serverUrl.matches('https://[A-Za-z0-9.-]+(:[0-9]+)?')) {
    throw new GradleException('serverUrl must be an HTTPS origin without a path')
}

android {
    namespace 'com.toncasino.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.toncasino.app'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '0.4.0'
        buildConfigField 'String', 'SERVER_URL', '"' + serverUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    if (releaseKeystore && releasePassword) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword releasePassword
                keyAlias 'toncasino'
                keyPassword releasePassword
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
