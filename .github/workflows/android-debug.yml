name: Android signed APK

on:
  push:
    branches: [main]
    paths:
      - 'android/app/**'
      - 'android/gradle/**'
      - 'android/gradlew'
      - 'android/ci-smoke.sh'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
        working-directory: android
      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ton-casino-release.p12"
      - name: Build signed APK
        run: ./gradlew --no-daemon assembleRelease
        working-directory: android
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/ton-casino-release.p12
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - name: Read and validate Android version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib
          import re
          text = pathlib.Path('android/app/build.gradle').read_text()
          code = int(re.search(r'\bversionCode\s+(\d+)', text).group(1))
          name = re.search(r"\bversionName\s+'([^']+)'", text).group(1)
          if not re.fullmatch(r'\d+\.\d+\.\d+', name):
              raise SystemExit('Android versionName must be X.Y.Z')
          feed = pathlib.Path('android/latest.json')
          if feed.exists() and code <= json.loads(feed.read_text())['version_code']:
              raise SystemExit('Increase versionCode before publishing another APK')
          print(f'code={code}')
          print(f'name={name}')
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci-smoke.sh
      - name: Publish signed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ton-casino.apk"
          gh release create "android-v${VERSION_CODE}" \
            "$RUNNER_TEMP/ton-casino.apk" \
            --title "Android ${VERSION_NAME}" --notes "Подписанная версия Android ${VERSION_NAME}." \
            --target "$GITHUB_SHA" --latest
      - name: Publish verified update feed
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          apk = Path('android/app/build/outputs/apk/release/app-release.apk')
          code = int(os.environ['VERSION_CODE'])
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/android-v{code}/ton-casino.apk"
          feed = {'version_code': code, 'version_name': os.environ['VERSION_NAME'],
                  'apk_url': url, 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
                  'size_bytes': apk.stat().st_size}
          Path('android/latest.json').write_text(json.dumps(feed, indent=2) + '\n')
          PY
          git add android/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Android update feed [skip ci]"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: ton-casino-android-signed
          path: android/app/build/outputs/apk/release/app-release.apk
