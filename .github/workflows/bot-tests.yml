name: Bot tests

on:
  push:
    branches: [main, 'codex/**']
    paths: ['**.py', 'requirements.txt', '.github/workflows/bot-tests.yml']
  pull_request:
    paths: ['**.py', 'requirements.txt', '.github/workflows/bot-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bot_tests
          POSTGRES_PASSWORD: bot_tests
          POSTGRES_DB: bot_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bot_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run bot, game and WebApp regressions
        run: python -m unittest discover -s tests -v
        env:
          TEST_POSTGRES_URL: postgresql://bot_tests:bot_tests@localhost:5432/bot_tests
      - name: Run WebApp and device sessions with PostgreSQL
        run: python -m unittest tests.test_webapp_mines -v
        env:
          BOT_TOKEN: offline-webapp-tests
          RENDER: 'false'
          DATABASE_URL: postgresql://bot_tests:bot_tests@localhost:5432/bot_tests
          ADMIN_PANEL_PASSWORD: offline-webapp-tests
          WEBHOOK_SECRET: offline-webapp-tests
